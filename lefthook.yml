# https://lefthook.dev/configuration/
pre-commit:
  parallel: false
  jobs:
    - name: format
      glob: '*.{js,mjs,cjs,ts,mts,cts,svelte,json,jsonc,md,yml,yaml,css,html}'
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: lint
      glob: '*.{js,mjs,cjs,ts,mts,cts,svelte}'
      run: pnpm exec oxlint --type-aware {staged_files}
