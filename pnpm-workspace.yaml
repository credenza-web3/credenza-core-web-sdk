packages:
  - 'apps/*'
  - 'packages/*'

autoInstallPeers: true

allowBuilds:
  esbuild: true
  # `svelte-kit sync` runs as part of `check`/`build`; hooks are installed by the root `prepare` script.
  '@sveltejs/kit': false
  lefthook: false
  # Optional native accelerators for `ws`; pure-JS fallbacks are used.
  bufferutil: false
  utf-8-validate: false
  svelte-preprocess: false
